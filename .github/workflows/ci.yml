name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: englishlearning_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EnglishLearningTestDatabase: Host=localhost;Port=5432;Database=englishlearning_tests;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.115
      - run: dotnet restore -p:WarningsAsErrors=NU1903%3BNU1904
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --logger trx --results-directory "${{ runner.temp }}/test-results"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: ignore
      - name: Verify Blazor publication
        run: |
          dotnet publish EnglishLearning.Api -c Release --no-restore -o published
          test -s published/wwwroot/index.html
          test -d published/wwwroot/_framework
